---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.22.0
  name: ocmdeployments.delivery.ocm.software
spec:
  group: delivery.ocm.software
  names:
    kind: OCMDeployment
    listKind: OCMDeploymentList
    plural: ocmdeployments
    singular: ocmdeployment
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - description: Indicates if the OCMDeployment is Ready
      jsonPath: .status.conditions[?(@.type=="Ready")].message
      name: Ready
      priority: 1
      type: string
    - description: Displays the Age of the OCMDeployment
      jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: OCMDeployment is the Schema for the ocmdeployments API.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: OCMDeploymentSpec defines the desired state of OCMDeployment.
            properties:
              component:
                description: |-
                  Component is the name of the ocm component; the controller creates a
                  Component from it.
                type: string
              config:
                description: Config is inline, schemaless configuration merged over
                  ConfigResources.
                type: object
                x-kubernetes-preserve-unknown-fields: true
              configResources:
                description: ConfigResources references OCM resources holding yaml
                  used as values/config.
                items:
                  description: ResourceID defines the configuration of the repository.
                  properties:
                    byReference:
                      description: |-
                        ResourceReference defines a reference to a resource akin to the OCM Specification.
                        For more details see dedicated guide in the Specification:
                        https://github.com/open-component-model/ocm-spec/blob/main/doc/05-guidelines/03-references.md#references
                      properties:
                        referencePath:
                          items:
                            additionalProperties:
                              type: string
                            description: |-
                              Identity is a map that represents a set of attributes that uniquely identity
                              arbitrary resources. It is used in various places in Open Component Model to uniquely
                              identity objects such as resources or components.
                            type: object
                          type: array
                        resource:
                          additionalProperties:
                            type: string
                          description: |-
                            Identity is a map that represents a set of attributes that uniquely identity
                            arbitrary resources. It is used in various places in Open Component Model to uniquely
                            identity objects such as resources or components.
                          type: object
                      required:
                      - resource
                      type: object
                  required:
                  - byReference
                  type: object
                type: array
              createNamespace:
                default: true
                description: CreateNamespace creates TargetNamespace if it does not
                  exist.
                type: boolean
              deployResource:
                description: |-
                  DeployResource identifies the OCM resource to deploy (a Helm chart or a
                  kustomize resource). The artifact kind is derived from the OCM resource type.
                properties:
                  byReference:
                    description: |-
                      ResourceReference defines a reference to a resource akin to the OCM Specification.
                      For more details see dedicated guide in the Specification:
                      https://github.com/open-component-model/ocm-spec/blob/main/doc/05-guidelines/03-references.md#references
                    properties:
                      referencePath:
                        items:
                          additionalProperties:
                            type: string
                          description: |-
                            Identity is a map that represents a set of attributes that uniquely identity
                            arbitrary resources. It is used in various places in Open Component Model to uniquely
                            identity objects such as resources or components.
                          type: object
                        type: array
                      resource:
                        additionalProperties:
                          type: string
                        description: |-
                          Identity is a map that represents a set of attributes that uniquely identity
                          arbitrary resources. It is used in various places in Open Component Model to uniquely
                          identity objects such as resources or components.
                        type: object
                    required:
                    - resource
                    type: object
                required:
                - byReference
                type: object
              deployer:
                description: Deployer selects the deployment engine.
                enum:
                - FluxCD
                - ArgoCD
                type: string
              interval:
                description: Interval at which the OCMDeployment is reconciled.
                type: string
              ocmConfig:
                description: |-
                  OCMConfig defines references to secrets, config maps or ocm api
                  objects providing configuration data including credentials.
                items:
                  description: |-
                    OCMConfiguration defines a configuration applied to the reconciliation of an
                    ocm k8s object as well as the policy for its propagation of this
                    configuration.
                  properties:
                    apiVersion:
                      description: API version of the referent, if not specified the
                        Kubernetes preferred version will be used.
                      type: string
                    kind:
                      description: Kind of the referent.
                      type: string
                    name:
                      description: Name of the referent.
                      type: string
                    namespace:
                      description: Namespace of the referent, when not specified it
                        acts as LocalObjectReference.
                      type: string
                    policy:
                      default: Propagate
                      description: |-
                        Policy affects the propagation behavior of the configuration. If set to
                        ConfigurationPolicyPropagate other ocm api objects can reference this
                        object to reuse this configuration.
                      enum:
                      - Propagate
                      - DoNotPropagate
                      type: string
                  required:
                  - kind
                  - name
                  - policy
                  type: object
                  x-kubernetes-validations:
                  - message: apiVersion must be one of "v1" with kind "Secret" or
                      "ConfigMap" or "delivery.ocm.software/v1alpha1" with the kind
                      of an OCM kubernetes object
                    rule: ((!has(self.apiVersion) || self.apiVersion == "" || self.apiVersion
                      == "v1") && (self.kind == "Secret" || self.kind == "ConfigMap"))
                      || (self.apiVersion == "delivery.ocm.software/v1alpha1" && (self.kind
                      == "Repository" || self.kind == "Component" || self.kind ==
                      "Resource"))
                type: array
              releaseName:
                description: |-
                  ReleaseName overrides the Helm release name. Defaults to the OCMDeployment
                  name, so two OCMDeployments do not collide unless both override it to the
                  same value in the same TargetNamespace. Ignored for kustomize.
                type: string
              repositorySpec:
                description: |-
                  RepositorySpec is the config of an ocm repository containing component
                  versions, as in the Repository CR. The controller creates a Repository
                  from it. An insecure or local registry is expressed here via an http
                  baseUrl, not via a reference scheme.
                x-kubernetes-preserve-unknown-fields: true
              semver:
                description: Semver constrains the fetched component version (exact
                  or range).
                type: string
              semverFilter:
                description: |-
                  SemverFilter is a regex pattern to filter the versions within the Semver
                  range.
                type: string
              serviceAccountName:
                description: |-
                  ServiceAccountName is the ServiceAccount the controller impersonates to
                  apply the generated deploy objects, so they are created with that
                  ServiceAccount's permissions and not the controller's. The ServiceAccount
                  must exist in the OCMDeployment's own namespace.
                type: string
              suspend:
                description: |-
                  Suspend tells the controller to suspend the reconciliation of this
                  OCMDeployment.
                type: boolean
              targetNamespace:
                description: |-
                  TargetNamespace is the namespace the workload is deployed into. Defaults
                  to the OCMDeployment's own namespace when unset.
                type: string
            required:
            - component
            - deployResource
            - deployer
            - interval
            - repositorySpec
            - semver
            - serviceAccountName
            type: object
          status:
            description: OCMDeploymentStatus defines the observed state of OCMDeployment.
            properties:
              appliedLocalizations:
                description: AppliedLocalizations records each image localization
                  that was applied.
                items:
                  description: |-
                    AppliedLocalization records a single image localization that was applied: the
                    original reference (the match key) and the relocated reference substituted in.
                  properties:
                    applied:
                      description: Applied is the relocated reference substituted
                        into the deploy objects.
                      type: string
                    digestPinned:
                      description: |-
                        DigestPinned is false when the chart exposed only a tag (no digest field),
                        so the substituted location is not digest-verified. The controller also
                        emits a warning Event for such images.
                      type: boolean
                    original:
                      description: Original is the reference the localization matched
                        on.
                      type: string
                  required:
                  - applied
                  - digestPinned
                  - original
                  type: object
                type: array
              conditions:
                description: Conditions holds the conditions for the OCMDeployment.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              deployed:
                description: |-
                  Deployed references the objects the controller created and owns: the child
                  Repository/Component/Resource objects and the generated deploy objects.
                items:
                  description: |-
                    DeployedObjectReference is a reference to an object that has been deployed by the Deployer.
                    It contains the API version, kind, name, and optionally the namespace of the deployed object.
                  properties:
                    apiVersion:
                      description: API version of the referent.
                      type: string
                    kind:
                      description: |-
                        Kind of the referent.
                        More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
                      type: string
                    name:
                      description: |-
                        Name of the referent.
                        More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                      type: string
                    namespace:
                      description: |-
                        Namespace of the referent.
                        More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/namespaces/
                      type: string
                    uid:
                      description: |-
                        UID of the referent.
                        More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#uids
                      type: string
                  required:
                  - apiVersion
                  - kind
                  - name
                  type: object
                type: array
              deployedComponentVersion:
                description: DeployedComponentVersion is the resolved component version
                  currently live.
                type: string
              deployedResourceDigest:
                description: DeployedResourceDigest is the digest of the deploy resource
                  currently live.
                type: string
              effectiveOCMConfig:
                description: |-
                  EffectiveOCMConfig specifies the entirety of config maps and secrets
                  whose configuration data was applied to the OCMDeployment reconciliation,
                  in the order the configuration data was applied.
                items:
                  description: |-
                    OCMConfiguration defines a configuration applied to the reconciliation of an
                    ocm k8s object as well as the policy for its propagation of this
                    configuration.
                  properties:
                    apiVersion:
                      description: API version of the referent, if not specified the
                        Kubernetes preferred version will be used.
                      type: string
                    kind:
                      description: Kind of the referent.
                      type: string
                    name:
                      description: Name of the referent.
                      type: string
                    namespace:
                      description: Namespace of the referent, when not specified it
                        acts as LocalObjectReference.
                      type: string
                    policy:
                      default: Propagate
                      description: |-
                        Policy affects the propagation behavior of the configuration. If set to
                        ConfigurationPolicyPropagate other ocm api objects can reference this
                        object to reuse this configuration.
                      enum:
                      - Propagate
                      - DoNotPropagate
                      type: string
                  required:
                  - kind
                  - name
                  - policy
                  type: object
                  x-kubernetes-validations:
                  - message: apiVersion must be one of "v1" with kind "Secret" or
                      "ConfigMap" or "delivery.ocm.software/v1alpha1" with the kind
                      of an OCM kubernetes object
                    rule: ((!has(self.apiVersion) || self.apiVersion == "" || self.apiVersion
                      == "v1") && (self.kind == "Secret" || self.kind == "ConfigMap"))
                      || (self.apiVersion == "delivery.ocm.software/v1alpha1" && (self.kind
                      == "Repository" || self.kind == "Component" || self.kind ==
                      "Resource"))
                type: array
              observedGeneration:
                description: |-
                  ObservedGeneration is the last observed generation of the OCMDeployment
                  object.
                format: int64
                type: integer
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
