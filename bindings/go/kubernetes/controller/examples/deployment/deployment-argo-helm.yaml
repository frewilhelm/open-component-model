# Argo + Helm. Same inputs as deployment-flux-helm, but the controller emits an
# Argo Application; the merged values land in
# Application.spec.source.helm.valuesObject.
apiVersion: delivery.ocm.software/v1alpha1
kind: OCMDeployment
metadata:
  name: deployment-argo-helm
spec:
  repositorySpec:
    type: OCIRegistry
    baseUrl: http://ocm-e2e-image-registry:5000
  component: ocm.software/ocm-k8s-toolkit/examples/deployment
  semver: 1.0.0
  deployResource:
    byReference:
      resource:
        name: podinfo-chart
  deployer: ArgoCD
  configResources:
    - byReference:
        resource:
          name: central-config
        referencePath:
          - name: central-config
    - byReference:
        resource:
          name: local-config
  config:
    ui:
      color: "#326ce5"
  targetNamespace: deployment-argo-helm
  createNamespace: true
  releaseName: podinfo
  serviceAccountName: deployment-sa
  interval: 1m
