# Deploy-time ServiceAccount referenced by each Deployment's spec.serviceAccountName.
# The controller applies the generated Flux/Argo objects impersonating this SA, so
# the deploy objects are created with the SA's permissions rather than the
# controller's. The Role below is illustrative and scoped to the engine objects the
# controller creates in this namespace; scope it down (or widen per target
# namespace) for real use.
#
# The controller's own ServiceAccount additionally needs `impersonate` on
# `serviceaccounts` to act as this SA (that grant is part of the controller's RBAC,
# not shipped here).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: deployment-sa
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: deployment-deployer
rules:
  - apiGroups: ["source.toolkit.fluxcd.io"]
    resources: ["ocirepositories"]
    verbs: ["create", "get", "list", "watch", "update", "patch", "delete"]
  - apiGroups: ["helm.toolkit.fluxcd.io"]
    resources: ["helmreleases"]
    verbs: ["create", "get", "list", "watch", "update", "patch", "delete"]
  - apiGroups: ["kustomize.toolkit.fluxcd.io"]
    resources: ["kustomizations"]
    verbs: ["create", "get", "list", "watch", "update", "patch", "delete"]
  - apiGroups: ["argoproj.io"]
    resources: ["applications"]
    verbs: ["create", "get", "list", "watch", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: deployment-deployer
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: deployment-deployer
subjects:
  - kind: ServiceAccount
    name: deployment-sa
