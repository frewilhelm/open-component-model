# Argo + Kustomize. Localization-only, like deployment-flux-kustomize, but the
# controller emits an Argo Application with a kustomize images override in
# Application.spec.source.kustomize.images.
apiVersion: delivery.ocm.software/v1alpha1
kind: Deployment
metadata:
  name: deployment-argo-kustomize
spec:
  componentVersionRef: "http://ocm-e2e-image-registry:5000//ocm.software/ocm-k8s-toolkit/examples/deployment:1.0.0"
  deployResource:
    byReference:
      resource:
        name: podinfo-kustomize
  deployer: ArgoCD
  targetNamespace: deployment-argo-kustomize
  createNamespace: true
  serviceAccountName: deployment-sa
  interval: 1m
