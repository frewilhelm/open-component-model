apiVersion: delivery.ocm.software/v1alpha1
kind: OCMDeployment
metadata:
  name: podinfo-argo-kustomize
  namespace: default
spec:
  source:
    repositorySpec:
      type: OCIRegistry
      baseUrl: http://ocm-e2e-image-registry:5000
    component: ocm.software/ocm-k8s-toolkit/examples/deployment
    semver: ">=1.0.0"
    interval: 10m
  deployResource:
    byReference:
      resource:
        name: podinfo-kustomize
  deployer: ArgoCD
  namespace:
    targetNamespace: deployment-argo-kustomize
    createNamespace: true
  applyServiceAccountName: deployment-argo-kustomize-sa
  argo:
    project: default
  # Kustomize config: config/configResources are passed through verbatim as Application kustomize patches.
  # Ordering mirrors Helm — configResources in spec order (central, then local), inline config last.
  configResources:
    - byReference:
        resource:
          name: central-patches
        referencePath:
          - name: central-config
    - byReference:
        resource:
          name: local-patches
  config:
    patches:
      - target:
          kind: Deployment
          name: podinfo
        patch: |
          - op: add
            path: /spec/template/metadata/labels/config.ocm.software~1applied
            value: "inline"
  interval: 5m
