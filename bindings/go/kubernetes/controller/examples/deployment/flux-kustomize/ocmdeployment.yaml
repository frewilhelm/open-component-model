apiVersion: delivery.ocm.software/v1alpha1
kind: OCMDeployment
metadata:
  name: podinfo-flux-kustomize
  namespace: default
spec:
  source:
    repositorySpec:
      type: OCIRegistry
      baseUrl: http://ocm-e2e-image-registry:5000
    component: ocm.software/ocm-k8s-toolkit/examples/deployment
    semver: ">=1.0.0"
    interval: 10m
  deployResource:
    byReference:
      resource:
        name: podinfo-kustomize
  deployer: FluxCD
  namespace:
    # createNamespace: false — Flux Kustomization does not provision its target namespace;
    # the e2e test creates it explicitly before applying this OCMDeployment.
    targetNamespace: deployment-flux-kustomize
    createNamespace: false
  applyServiceAccountName: deployment-flux-kustomize-sa
  flux:
    serviceAccountName: deployment-flux-kustomize-sa
  # Kustomize config: config/configResources are passed through verbatim as Kustomization patches.
  # Ordering mirrors Helm — configResources in spec order (central, then local), inline config last.
  configResources:
    - byReference:
        resource:
          name: central-patches
        referencePath:
          - name: central-config
    - byReference:
        resource:
          name: local-patches
  config:
    patches:
      - target:
          kind: Deployment
          name: podinfo
        patch: |
          - op: add
            path: /spec/template/metadata/labels/config.ocm.software~1applied
            value: "inline"
  interval: 5m
