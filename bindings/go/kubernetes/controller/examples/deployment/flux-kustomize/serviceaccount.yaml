---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: deployment-flux-kustomize-sa
  namespace: default
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: deployment-flux-kustomize-role
  namespace: default
rules:
  - apiGroups: ["source.toolkit.fluxcd.io"]
    resources: ["ocirepositories"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["kustomize.toolkit.fluxcd.io"]
    resources: ["kustomizations"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: deployment-flux-kustomize-rb
  namespace: default
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: deployment-flux-kustomize-role
subjects:
  - kind: ServiceAccount
    name: deployment-flux-kustomize-sa
    namespace: default
---
# Role in the target namespace: exactly the resources the podinfo kustomize manifests create.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: deployment-flux-kustomize-target-role
  namespace: deployment-flux-kustomize
rules:
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["services", "serviceaccounts", "configmaps", "secrets", "pods"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["autoscaling"]
    resources: ["horizontalpodautoscalers"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: deployment-flux-kustomize-target-rb
  namespace: deployment-flux-kustomize
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: deployment-flux-kustomize-target-role
subjects:
  - kind: ServiceAccount
    name: deployment-flux-kustomize-sa
    namespace: default
---
# Namespace is cluster-scoped; applyset conflict detection requires list at cluster scope.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: deployment-flux-kustomize-ns-role
rules:
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "list", "create", "patch", "update", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: deployment-flux-kustomize-ns-rb
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: deployment-flux-kustomize-ns-role
subjects:
  - kind: ServiceAccount
    name: deployment-flux-kustomize-sa
    namespace: default
