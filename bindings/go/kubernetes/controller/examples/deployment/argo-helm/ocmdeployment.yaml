apiVersion: delivery.ocm.software/v1alpha1
kind: OCMDeployment
metadata:
  name: podinfo-argo-helm
  namespace: default
spec:
  source:
    repositorySpec:
      type: OCIRegistry
      baseUrl: http://ocm-e2e-image-registry:5000
    component: ocm.software/ocm-k8s-toolkit/examples/deployment
    semver: ">=1.0.0"
    interval: 10m
  deployResource:
    byReference:
      resource:
        name: podinfo-chart
  deployer: ArgoCD
  namespace:
    targetNamespace: deployment-argo-helm
    createNamespace: true
  releaseName: podinfo
  applyServiceAccountName: deployment-argo-helm-sa
  argo:
    project: default
  configResources:
    - byReference:
        resource:
          name: central-config
        referencePath:
          - name: central-config
    - byReference:
        resource:
          name: local-config
  config:
    ui:
      color: "#326ce5"
  interval: 5m
