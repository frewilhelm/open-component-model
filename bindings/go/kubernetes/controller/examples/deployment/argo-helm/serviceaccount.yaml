---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: deployment-argo-helm-sa
  namespace: default
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: deployment-argo-helm-role
  namespace: default
rules:
  - apiGroups: ["argoproj.io"]
    resources: ["applications"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: deployment-argo-helm-rb
  namespace: default
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: deployment-argo-helm-role
subjects:
  - kind: ServiceAccount
    name: deployment-argo-helm-sa
    namespace: default
---
# Namespace is cluster-scoped; applyset conflict detection requires list at cluster scope.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: deployment-argo-helm-ns-role
rules:
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "list", "create", "patch", "update", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: deployment-argo-helm-ns-rb
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: deployment-argo-helm-ns-role
subjects:
  - kind: ServiceAccount
    name: deployment-argo-helm-sa
    namespace: default
