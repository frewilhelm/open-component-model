---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: deployment-flux-helm-sa
  namespace: default
---
# Role in the OCMDeployment namespace: engine objects + Helm release state secrets.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: deployment-flux-helm-role
  namespace: default
rules:
  - apiGroups: ["source.toolkit.fluxcd.io"]
    resources: ["ocirepositories"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["helm.toolkit.fluxcd.io"]
    resources: ["helmreleases"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # Flux stores Helm release state (sh.helm.release.v1.*) as Secrets in this namespace.
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["configmaps", "serviceaccounts"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: deployment-flux-helm-rb
  namespace: default
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: deployment-flux-helm-role
subjects:
  - kind: ServiceAccount
    name: deployment-flux-helm-sa
    namespace: default
---
# Role in the target namespace: exactly the resources the podinfo chart creates.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: deployment-flux-helm-target-role
  namespace: deployment-flux-helm
rules:
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["services", "serviceaccounts", "configmaps", "secrets", "pods"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["autoscaling"]
    resources: ["horizontalpodautoscalers"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: deployment-flux-helm-target-rb
  namespace: deployment-flux-helm
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: deployment-flux-helm-target-role
subjects:
  - kind: ServiceAccount
    name: deployment-flux-helm-sa
    namespace: default
---
# Namespace is cluster-scoped; applyset conflict detection requires list at cluster scope.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: deployment-flux-helm-ns-role
rules:
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "list", "create", "patch", "update", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: deployment-flux-helm-ns-rb
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: deployment-flux-helm-ns-role
subjects:
  - kind: ServiceAccount
    name: deployment-flux-helm-sa
    namespace: default
