apiVersion: kro.run/v1alpha1
kind: ResourceGraphDefinition
metadata:
  name: discovery-localization
spec:
  schema:
    apiVersion: v1alpha1
    kind: DiscoveryLocalization
    spec:
      prefix: string | default="discovery-localization"
  resources:
    - id: chartDiscovery
      readyWhen:
        - ${chartDiscovery.status.conditions.exists(c, c.type == "Ready" && c.status == "True")}
        - ${chartDiscovery.status.observedGeneration == chartDiscovery.metadata.generation}
      template:
        apiVersion: delivery.ocm.software/v1alpha1
        kind: Discovery
        metadata:
          name: ${schema.spec.prefix + '-charts'}
        spec:
          componentRef:
            name: discovery-localization-component
          resourceSelector:
            matchIdentity:
              name: helm-resource
          extract:
            byResources:
              chart: referencePath[size(referencePath) - 1].name
              resource: '{"name": resource.name}'
              referencePath: referencePath
    # Image names use the image- prefix in this example. The reference-path
    # leaf is a unique chart key here; it is not a universal graph identifier.
    - id: imageDiscovery
      readyWhen:
        - ${imageDiscovery.status.conditions.exists(c, c.type == "Ready" && c.status == "True")}
        - ${imageDiscovery.status.observedGeneration == imageDiscovery.metadata.generation}
      template:
        apiVersion: delivery.ocm.software/v1alpha1
        kind: Discovery
        metadata:
          name: ${schema.spec.prefix + '-images'}
        spec:
          componentRef:
            name: discovery-localization-component
          resourceSelector:
            expression: identity.name.startsWith("image-")
          extract:
            byResources:
              chart: referencePath[size(referencePath) - 1].name
              name: referencePath[size(referencePath) - 1].name + "-" + resource.name
              resource: '{"name": resource.name}'
              referencePath: referencePath
    - id: charts
      forEach:
        - rec: ${chartDiscovery.status.extracted}
      readyWhen:
        - ${each.status.conditions.exists(c, c.type == "Ready" && c.status == "True")}
        - ${each.status.observedGeneration == each.metadata.generation}
      template:
        apiVersion: delivery.ocm.software/v1alpha1
        kind: Resource
        metadata:
          name: ${schema.spec.prefix + '-' + rec.chart}
          labels:
            discovery.ocm.software/chart: ${schema.spec.prefix + '-' + rec.chart}
        spec:
          componentRef:
            name: discovery-localization-component
          resource:
            byReference:
              resource: ${rec.resource}
              referencePath: ${rec.referencePath}
          additionalStatusFields:
            registry: resource.access.toOCI().registry
            repository: resource.access.toOCI().repository
            digest: resource.access.toOCI().digest
    - id: images
      forEach:
        - rec: ${imageDiscovery.status.extracted}
      readyWhen:
        - ${each.status.conditions.exists(c, c.type == "Ready" && c.status == "True")}
        - ${each.status.observedGeneration == each.metadata.generation}
      template:
        apiVersion: delivery.ocm.software/v1alpha1
        kind: Resource
        metadata:
          name: ${schema.spec.prefix + '-image-' + rec.name}
          labels:
            discovery.ocm.software/chart: ${schema.spec.prefix + '-' + rec.chart}
        spec:
          componentRef:
            name: discovery-localization-component
          resource:
            byReference:
              resource: ${rec.resource}
              referencePath: ${rec.referencePath}
          additionalStatusFields:
            reference: resource.access.imageReference
            registry: resource.access.toOCI().registry
            repository: resource.access.toOCI().repository
            tag: resource.access.toOCI().tag
            # Evaluate this inside the Resource controller after resolution,
            # rather than injecting a literal value path as a CEL expression.
            targets: >-
              has(resource.labels) && resource.labels != null
                ? resource.labels.filter(l, l.name == "localization.ocm.software/helm").map(l, l.value)
                : []
    - id: imageReferences
      forEach:
        - chart: ${charts}
      template:
        apiVersion: v1
        kind: ConfigMap
        metadata:
          name: ${chart.metadata.name + '-images'}
        data:
          images: '${images.filter(i, i.metadata.labels["discovery.ocm.software/chart"] == chart.metadata.labels["discovery.ocm.software/chart"]).map(i, i.status.additional.reference).join(",")}'
    # An OCM label name is unique on a resource, so targets[0] is the one
    # declared mapping, not an arbitrary image chosen from a collection.
    - id: localizationValues
      forEach:
        - img: ${images.filter(i, size(i.status.additional.targets) > 0)}
      template:
        apiVersion: v1
        kind: ConfigMap
        metadata:
          name: ${img.metadata.name + '-values'}
          labels:
            discovery.ocm.software/chart: ${img.metadata.labels["discovery.ocm.software/chart"]}
            reconcile.fluxcd.io/watch: "Enabled"
          annotations:
            localization.ocm.software/repository-path: ${img.status.additional.targets[0].repository}
            localization.ocm.software/tag-path: ${img.status.additional.targets[0].tag}
        data:
          repository: ${img.status.additional.registry + "/" + img.status.additional.repository}
          tag: ${img.status.additional.tag}
    - id: ocirepositories
      forEach:
        - chart: ${charts}
      template:
        apiVersion: source.toolkit.fluxcd.io/v1
        kind: OCIRepository
        metadata:
          name: ${chart.metadata.name + '-oci'}
          labels:
            discovery.ocm.software/chart: ${chart.metadata.labels["discovery.ocm.software/chart"]}
        spec:
          interval: 1m0s
          insecure: true
          layerSelector:
            mediaType: application/vnd.cncf.helm.chart.content.v1.tar+gzip
            operation: copy
          url: oci://${chart.status.additional.registry}/${chart.status.additional.repository}
          ref:
            digest: ${chart.status.additional.digest}
    - id: helmreleases
      forEach:
        - source: ${ocirepositories}
      template:
        apiVersion: helm.toolkit.fluxcd.io/v2
        kind: HelmRelease
        metadata:
          name: ${source.metadata.labels["discovery.ocm.software/chart"] + '-hr'}
        spec:
          releaseName: ${source.metadata.labels["discovery.ocm.software/chart"]}
          interval: 1m
          timeout: 5m
          chartRef:
            kind: OCIRepository
            name: ${source.metadata.name}
            namespace: default
          # Reference the ConfigMap collection itself: kro creates the values
          # ConfigMaps before HelmReleases. dyn handles Flux's typed list schema.
          valuesFrom: >-
            ${dyn(localizationValues
              .filter(v, v.metadata.labels["discovery.ocm.software/chart"] == source.metadata.labels["discovery.ocm.software/chart"])
              .map(v, [
                {"kind": "ConfigMap", "name": v.metadata.name, "valuesKey": "repository", "targetPath": v.metadata.annotations["localization.ocm.software/repository-path"]},
                {"kind": "ConfigMap", "name": v.metadata.name, "valuesKey": "tag", "targetPath": v.metadata.annotations["localization.ocm.software/tag-path"]}
              ]).flatten())}
