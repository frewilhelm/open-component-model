components:
  # Root, rgd and platform live in repository A (the registry root). The chart
  # components live in repository B (subPath discovery-localization-charts) and
  # are found through a resolver configuration (see bootstrap.yaml).
  - name: ocm.software/ocm-k8s-toolkit/examples/discovery-localization
    version: "1.0.0"
    provider:
      name: ocm.software
    componentReferences:
      - name: nested-rgd
        componentName: ocm.software/ocm-k8s-toolkit/examples/discovery-localization/rgd
        version: "1.0.0"
      - name: platform
        componentName: ocm.software/ocm-k8s-toolkit/examples/discovery-localization/platform
        version: "1.0.0"
  - name: ocm.software/ocm-k8s-toolkit/examples/discovery-localization/rgd
    version: "1.0.0"
    provider:
      name: ocm.software
    resources:
      - name: kro-rgd
        type: blob
        version: "1.0.0"
        input:
          type: file
          path: ./rgd.yaml
  - name: ocm.software/ocm-k8s-toolkit/examples/discovery-localization/platform
    version: "1.0.0"
    provider:
      name: ocm.software
    componentReferences:
      - name: chart-a
        componentName: ocm.software/ocm-k8s-toolkit/examples/discovery-localization/chart-a
        version: "1.0.0"
      - name: chart-b
        componentName: ocm.software/ocm-k8s-toolkit/examples/discovery-localization/chart-b
        version: "1.0.0"
  # chart-a carries two images (the one the chart deploys and an extra canary
  # image); chart-b carries one. The number of images per chart is discovered,
  # not hard-coded.
  - name: ocm.software/ocm-k8s-toolkit/examples/discovery-localization/chart-a
    version: "1.0.0"
    provider:
      name: ocm.software
    resources:
      - name: helm-resource
        type: helmChart
        version: "1.0.0"
        access:
          type: ociArtifact
          imageReference: "ghcr.io/stefanprodan/charts/podinfo:6.9.1@sha256:565d310746f1fa4be7f93ba7965bb393153a2d57a15cfe5befc909b790a73f8a"
      - name: image-podinfo
        type: ociImage
        version: "6.9.1"
        access:
          type: ociRegistry
          imageReference: "ghcr.io/stefanprodan/podinfo:6.9.1@sha256:262578cde928d5c9eba3bce079976444f624c13ed0afb741d90d5423877496cb"
      - name: image-podinfo-canary
        type: ociImage
        version: "6.9.0"
        access:
          type: ociRegistry
          imageReference: "ghcr.io/stefanprodan/podinfo:6.9.0@sha256:10af81c9659824cecaa7fe09134c6c318136341b4ae84c4a37f18d9bd8a33eac"
  - name: ocm.software/ocm-k8s-toolkit/examples/discovery-localization/chart-b
    version: "1.0.0"
    provider:
      name: ocm.software
    resources:
      - name: helm-resource
        type: helmChart
        version: "1.0.0"
        access:
          type: ociArtifact
          imageReference: "ghcr.io/stefanprodan/charts/podinfo:6.7.1@sha256:4d5bd3562f0b150bd6cdfdbfb149e7e4ac36e555e25baa1da9f511f4d9fb7391"
      - name: image-podinfo
        type: ociImage
        version: "6.7.1"
        access:
          type: ociRegistry
          imageReference: "ghcr.io/stefanprodan/podinfo:6.7.1@sha256:862ca45e61b32392f7941a1bdfdbe5ff8b6899070135f1bdca1c287d0057fc94"
