apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-webservice
  labels:
    app.kubernetes.io/name: {{ .Release.Name }}-webservice
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Release.Name }}-webservice
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Release.Name }}-webservice
    spec:
      containers:
        - name: main
          image: "{{ .Values.main.image.repository }}:{{ .Values.main.image.tag }}"
          ports:
            - containerPort: 9898
