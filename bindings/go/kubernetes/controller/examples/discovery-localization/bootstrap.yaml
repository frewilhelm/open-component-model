# Resolver configuration: product components matching the products pattern are
# fetched from repository B (subPath discovery-localization-products); the root
# component falls back to repository A. The Component propagates this
# configuration to Discovery and Resource objects via policy: Propagate.
apiVersion: v1
kind: ConfigMap
metadata:
  name: discovery-localization-resolvers
data:
  .ocmconfig: |
    type: generic.config.ocm.software/v1
    configurations:
      - type: resolvers.config.ocm.software/v1alpha1
        resolvers:
          - repository:
              type: OCIRepository/v1
              baseUrl: http://ocm-e2e-image-registry:5000
              subPath: discovery-localization-products
            componentNamePattern: "example.com/products/*"
---
apiVersion: delivery.ocm.software/v1alpha1
kind: Repository
metadata:
  name: discovery-localization-repository
spec:
  repositorySpec:
    # Adjust to your OCM repository (repository A)
    baseUrl: http://ocm-e2e-image-registry:5000
    type: OCIRegistry
  interval: 10m
---
apiVersion: delivery.ocm.software/v1alpha1
kind: Component
metadata:
  name: discovery-localization-component
spec:
  component: example.com/observability-demo
  repositoryRef:
    name: discovery-localization-repository
  semver: 1.0.0
  interval: 10m
  ocmConfig:
    - kind: ConfigMap
      name: discovery-localization-resolvers
      policy: Propagate
