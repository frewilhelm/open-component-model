{{- if .Values.crd.enable }}
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.22.0
    {{- if .Values.crd.keep }}
    helm.sh/resource-policy: keep
    {{- end }}
    {{- if and .Values.webhook.enable .Values.certManager.enable }}
    cert-manager.io/inject-ca-from: {{ .Release.Namespace }}/{{ include "ocm-k8s-toolkit.resourceName" (dict "suffix" "serving-cert" "context" $) }}
    {{- end }}
  name: ocmdeployments.delivery.ocm.software
spec:
  {{- if .Values.webhook.enable }}
  conversion:
    strategy: Webhook
    webhook:
      clientConfig:
        service:
          name: {{ include "ocm-k8s-toolkit.resourceName" (dict "suffix" "webhook-service" "context" $) }}
          namespace: {{ .Release.Namespace }}
          path: /convert
      conversionReviewVersions:
        - v1
  {{- end }}
  group: delivery.ocm.software
  names:
    kind: OCMDeployment
    listKind: OCMDeploymentList
    plural: ocmdeployments
    singular: ocmdeployment
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - description: Indicates if the OCMDeployment is Ready
      jsonPath: .status.conditions[?(@.type=="Ready")].message
      name: Ready
      priority: 1
      type: string
    - description: Displays the Age of the OCMDeployment
      jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: OCMDeployment is the Schema for the ocmdeployments API.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: OCMDeploymentSpec defines the desired state of OCMDeployment.
            properties:
              applyServiceAccountName:
                description: |-
                  ApplyServiceAccountName is the service account the controller impersonates when applying
                  the rendered engine objects. If empty, the default SA of the OCMDeployment's namespace is used.
                type: string
              argo:
                description: Argo holds Argo CD–specific rendering options. Must only
                  be set when deployer is ArgoCD.
                properties:
                  project:
                    description: Project is the Argo CD AppProject that the Application
                      is placed in.
                    type: string
                  repoCredentialsSecretRef:
                    description: |-
                      RepoCredentialsSecretRef is an optional reference to a secret holding credentials for an HTTP
                      Helm-repository source (a Helm/v1 deploy resource). Argo CD resolves repository credentials from
                      a Secret in its own namespace; this names that Secret. Ignored for OCI sources.
                    properties:
                      name:
                        default: ""
                        description: |-
                          Name of the referent.
                          This field is effectively required, but due to backwards compatibility is
                          allowed to be empty. Instances of this type with an empty value here are
                          almost certainly wrong.
                          More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                        type: string
                    type: object
                    x-kubernetes-map-type: atomic
                type: object
              config:
                description: |-
                  Config is inline YAML/JSON configuration merged last into the deploy resource's values
                  (highest precedence; Helm only).
                type: object
                x-kubernetes-preserve-unknown-fields: true
              configResources:
                description: |-
                  ConfigResources lists additional OCM resources that contain YAML configuration to merge
                  into the deploy resource's values (Helm only; kustomize config is not supported).
                items:
                  description: OCMResourceRef identifies a single OCM resource via
                    a ResourceReference and an optional verification policy.
                  properties:
                    byReference:
                      description: ByReference identifies the OCM resource by component
                        + resource identity path.
                      properties:
                        referencePath:
                          items:
                            additionalProperties:
                              type: string
                            description: |-
                              Identity is a map that represents a set of attributes that uniquely identity
                              arbitrary resources. It is used in various places in Open Component Model to uniquely
                              identity objects such as resources or components.
                            type: object
                          type: array
                        resource:
                          additionalProperties:
                            type: string
                          description: |-
                            Identity is a map that represents a set of attributes that uniquely identity
                            arbitrary resources. It is used in various places in Open Component Model to uniquely
                            identity objects such as resources or components.
                          type: object
                      required:
                      - resource
                      type: object
                    verificationPolicy:
                      default: Always
                      description: VerificationPolicy controls when resource digest
                        verification is performed.
                      enum:
                      - Always
                      - Never
                      type: string
                  required:
                  - byReference
                  type: object
                type: array
              deletionPolicy:
                default: Background
                description: |-
                  DeletionPolicy controls how the deployed engine objects are removed when the OCMDeployment
                  is deleted. Background and Foreground prune the applyset members; Orphan strips the applyset
                  label and owner reference from them without deleting.
                enum:
                - Background
                - Foreground
                - Orphan
                type: string
              deployResource:
                description: DeployResource identifies the OCM resource (Helm chart
                  or kustomization) to deploy.
                properties:
                  byReference:
                    description: ByReference identifies the OCM resource by component
                      + resource identity path.
                    properties:
                      referencePath:
                        items:
                          additionalProperties:
                            type: string
                          description: |-
                            Identity is a map that represents a set of attributes that uniquely identity
                            arbitrary resources. It is used in various places in Open Component Model to uniquely
                            identity objects such as resources or components.
                          type: object
                        type: array
                      resource:
                        additionalProperties:
                          type: string
                        description: |-
                          Identity is a map that represents a set of attributes that uniquely identity
                          arbitrary resources. It is used in various places in Open Component Model to uniquely
                          identity objects such as resources or components.
                        type: object
                    required:
                    - resource
                    type: object
                  verificationPolicy:
                    default: Always
                    description: VerificationPolicy controls when resource digest
                      verification is performed.
                    enum:
                    - Always
                    - Never
                    type: string
                required:
                - byReference
                type: object
              deployer:
                description: Deployer selects the GitOps engine.
                enum:
                - FluxCD
                - ArgoCD
                type: string
              flux:
                description: Flux holds Flux-specific rendering options. Must only
                  be set when deployer is FluxCD.
                properties:
                  serviceAccountName:
                    description: ServiceAccountName is the service account that Flux
                      uses when applying the deploy resource.
                    type: string
                  sourceSecretRef:
                    description: |-
                      SourceSecretRef is an optional reference to a secret with credentials for the deploy source.
                      For an OCI source it is stamped onto the OCIRepository's secretRef; for an HTTP Helm-repository
                      source (a Helm/v1 access) it is stamped onto the rendered HelmRepository's secretRef.
                    properties:
                      name:
                        default: ""
                        description: |-
                          Name of the referent.
                          This field is effectively required, but due to backwards compatibility is
                          allowed to be empty. Instances of this type with an empty value here are
                          almost certainly wrong.
                          More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                        type: string
                    type: object
                    x-kubernetes-map-type: atomic
                type: object
              interval:
                description: Interval is how often the controller reconciles this
                  OCMDeployment.
                type: string
              namespace:
                description: Namespace controls the target namespace for the deployed
                  workload.
                properties:
                  createNamespace:
                    default: true
                    description: CreateNamespace, when true, creates the target namespace
                      if it does not exist.
                    type: boolean
                  pruneNamespace:
                    default: false
                    description: |-
                      PruneNamespace, when true, deletes the target namespace when the OCMDeployment is deleted
                      (only when deletionPolicy is not Orphan).
                    type: boolean
                  targetNamespace:
                    description: TargetNamespace is the namespace into which the workload
                      is deployed.
                    type: string
                type: object
              ocmConfig:
                description: |-
                  OCMConfig defines references to secrets, config maps, or OCM API objects providing
                  OCM configuration (credentials, plug-ins, etc.).
                items:
                  description: |-
                    OCMConfiguration defines a configuration applied to the reconciliation of an
                    ocm k8s object as well as the policy for its propagation of this
                    configuration.
                  properties:
                    apiVersion:
                      description: API version of the referent, if not specified the
                        Kubernetes preferred version will be used.
                      type: string
                    kind:
                      description: Kind of the referent.
                      type: string
                    name:
                      description: Name of the referent.
                      type: string
                    namespace:
                      description: Namespace of the referent, when not specified it
                        acts as LocalObjectReference.
                      type: string
                    policy:
                      default: Propagate
                      description: |-
                        Policy affects the propagation behavior of the configuration. If set to
                        ConfigurationPolicyPropagate other ocm api objects can reference this
                        object to reuse this configuration.
                      enum:
                      - Propagate
                      - DoNotPropagate
                      type: string
                  required:
                  - kind
                  - name
                  - policy
                  type: object
                  x-kubernetes-validations:
                  - message: apiVersion must be one of "v1" with kind "Secret" or
                      "ConfigMap" or "delivery.ocm.software/v1alpha1" with the kind
                      of an OCM kubernetes object
                    rule: ((!has(self.apiVersion) || self.apiVersion == "" || self.apiVersion
                      == "v1") && (self.kind == "Secret" || self.kind == "ConfigMap"))
                      || (self.apiVersion == "delivery.ocm.software/v1alpha1" && (self.kind
                      == "Repository" || self.kind == "Component" || self.kind ==
                      "Resource"))
                type: array
              releaseName:
                description: ReleaseName is the Helm release name (Flux Helm only).
                type: string
              source:
                description: Source describes the OCM component to deploy from.
                properties:
                  component:
                    description: Component is the OCM component name.
                    type: string
                  downgradePolicy:
                    default: Deny
                    description: |-
                      DowngradePolicy controls whether the controller may switch to a lower component version
                      when the semver constraint changes.
                    enum:
                    - Allow
                    - Deny
                    type: string
                  interval:
                    description: Interval is how often the controller checks for a
                      new component version.
                    type: string
                  repositorySpec:
                    description: RepositorySpec is the raw OCM repository specification
                      used to create a child Repository CR.
                    type: object
                    x-kubernetes-preserve-unknown-fields: true
                  semver:
                    description: Semver is the version constraint used to resolve
                      the component version.
                    type: string
                  semverFilter:
                    description: SemverFilter is an optional additional regex filter
                      applied after semver resolution.
                    type: string
                required:
                - component
                - interval
                - repositorySpec
                - semver
                type: object
              suspend:
                description: Suspend, when true, pauses reconciliation.
                type: boolean
            required:
            - deployResource
            - deployer
            - interval
            - source
            type: object
            x-kubernetes-validations:
            - message: argo options must not be set when deployer is FluxCD
              rule: self.deployer != 'FluxCD' || !has(self.argo)
            - message: flux options must not be set when deployer is ArgoCD
              rule: self.deployer != 'ArgoCD' || !has(self.flux)
            - message: deployer is immutable
              rule: self.deployer == oldSelf.deployer
          status:
            description: OCMDeploymentStatus defines the observed state of OCMDeployment.
            properties:
              appliedLocalizations:
                description: |-
                  AppliedLocalizations records every image reference substitution performed during the last
                  localization pass.
                items:
                  description: AppliedLocalization records a single image reference
                    substitution performed during localization.
                  properties:
                    applied:
                      description: Applied is the relocated image reference that was
                        substituted in.
                      type: string
                    digestPinned:
                      description: |-
                        DigestPinned is true when the substituted reference includes the content-addressed digest
                        from the signed localization label.
                      type: boolean
                    matchKey:
                      description: MatchKey is the original image reference (registry/repository:tag)
                        that was matched.
                      type: string
                  required:
                  - applied
                  - digestPinned
                  - matchKey
                  type: object
                type: array
              conditions:
                description: Conditions holds the conditions for the OCMDeployment.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              deployed:
                description: |-
                  Deployed lists the engine objects (OCIRepository, HelmRelease, Kustomization, Application,
                  Namespace) that were last applied by the controller.
                items:
                  description: |-
                    DeployedObjectReference is a reference to an object that has been deployed by the Deployer.
                    It contains the API version, kind, name, and optionally the namespace of the deployed object.
                  properties:
                    apiVersion:
                      description: API version of the referent.
                      type: string
                    kind:
                      description: |-
                        Kind of the referent.
                        More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
                      type: string
                    name:
                      description: |-
                        Name of the referent.
                        More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                      type: string
                    namespace:
                      description: |-
                        Namespace of the referent.
                        More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/namespaces/
                      type: string
                    uid:
                      description: |-
                        UID of the referent.
                        More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#uids
                      type: string
                  required:
                  - apiVersion
                  - kind
                  - name
                  type: object
                type: array
              deployedComponentVersion:
                description: DeployedComponentVersion is the component version that
                  was last successfully deployed.
                type: string
              deployedResourceDigest:
                description: |-
                  DeployedResourceDigest is the content digest of the deploy resource that was last applied.
                  Used to gate re-localization to avoid churn every reconcile.
                type: string
              effectiveOCMConfig:
                description: |-
                  EffectiveOCMConfig is the full resolved OCM configuration that was applied during the last
                  reconciliation.
                items:
                  description: |-
                    OCMConfiguration defines a configuration applied to the reconciliation of an
                    ocm k8s object as well as the policy for its propagation of this
                    configuration.
                  properties:
                    apiVersion:
                      description: API version of the referent, if not specified the
                        Kubernetes preferred version will be used.
                      type: string
                    kind:
                      description: Kind of the referent.
                      type: string
                    name:
                      description: Name of the referent.
                      type: string
                    namespace:
                      description: Namespace of the referent, when not specified it
                        acts as LocalObjectReference.
                      type: string
                    policy:
                      default: Propagate
                      description: |-
                        Policy affects the propagation behavior of the configuration. If set to
                        ConfigurationPolicyPropagate other ocm api objects can reference this
                        object to reuse this configuration.
                      enum:
                      - Propagate
                      - DoNotPropagate
                      type: string
                  required:
                  - kind
                  - name
                  - policy
                  type: object
                  x-kubernetes-validations:
                  - message: apiVersion must be one of "v1" with kind "Secret" or
                      "ConfigMap" or "delivery.ocm.software/v1alpha1" with the kind
                      of an OCM kubernetes object
                    rule: ((!has(self.apiVersion) || self.apiVersion == "" || self.apiVersion
                      == "v1") && (self.kind == "Secret" || self.kind == "ConfigMap"))
                      || (self.apiVersion == "delivery.ocm.software/v1alpha1" && (self.kind
                      == "Repository" || self.kind == "Component" || self.kind ==
                      "Resource"))
                type: array
              lastApplyTime:
                description: |-
                  LastApplyTime is the time at which the engine objects were last applied. Used by the Argo
                  no-status timeout.
                format: date-time
                type: string
              observedGeneration:
                description: ObservedGeneration is the last observed generation.
                format: int64
                type: integer
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
{{- end }}
